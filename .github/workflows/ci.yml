name: CI

# Verifies every pull request and every push to main. Read-only: no secrets, no deploy, no Cloudflare account. The tests run in a local
# workerd with fixed test values (vitest.config.ts) and need no network; only `npm ci` and `npm audit` talk to the npm registry.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high and critical only)
        run: npm audit --audit-level=high

      # tsc -b, ESLint, Prettier and the Worker bundle guard (check:bundle).
      - name: Type check, lint, format and bundle guard
        run: npm run check

      # Already part of `npm run check`; run on its own as well so a failure of the guard is named in the log.
      - name: Worker bundle guard
        run: npm run check:bundle

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
